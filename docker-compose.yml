services:
  drishti-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drishti_geospatial_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://drishti_admin:secure_drishti_pass_2026@drishti-postgis:5432/drishti_db
      - REDIS_URL=redis://drishti-redis:6379
      - JWT_SECRET=drishti_production_jwt_secret_token_key_change_me
    depends_on:
      drishti-postgis:
        condition: service_healthy
      drishti-redis:
        condition: service_started
    networks:
      - drishti-network

  drishti-postgis:
    image: postgis/postgis:15-3.3
    container_name: drishti_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drishti_admin
      POSTGRES_PASSWORD: secure_drishti_pass_2026
      POSTGRES_DB: drishti_db
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti_admin -d drishti_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drishti-network

  drishti-redis:
    image: redis:7.2-alpine
    container_name: drishti_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - drishti-network

networks:
  drishti-network:
    driver: bridge

volumes:
  postgis_data:
    driver: local
