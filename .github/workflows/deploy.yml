name: Drishti Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck & Lint
        run: npm run lint

      - name: Execute Backend & Algorithmic Unit Tests
        run: npm test

  build-and-containerize:
    name: Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drishti-repo/drishti-app:${{ github.sha }}
            asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drishti-repo/drishti-app:latest

  deploy-to-cloud-run:
    name: Deploy to Google Cloud Run / GKE
    needs: build-and-containerize
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: drishti-satellite-engine
          image: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drishti-repo/drishti-app:${{ github.sha }}
          region: asia-south1
          flags: '--port=3000 --memory=2Gi --cpu=2 --min-instances=1 --max-instances=20'
